apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-backend
  namespace: cloudforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudforge-backend
  template:
    metadata:
      labels:
        app: cloudforge-backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cloudforge-backend-sa
      containers:
        - name: backend
          image: cloudforgedevacr001.azurecr.io/cloudforge-backend:v2
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
            - name: APP_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi