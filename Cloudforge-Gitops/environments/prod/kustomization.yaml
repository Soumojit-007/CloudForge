apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudforge-prod

resources:
  - ../../apps/cloudforge

patches:
  - target:
      group: ""
      version: v1
      kind: Namespace
      name: cloudforge
    patch: |-
      - op: replace
        path: /metadata/name
        value: cloudforge-prod

  - target:
      group: ""
      version: v1
      kind: ConfigMap
      name: cloudforge-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prod

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cloudforge-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cloudforge-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
