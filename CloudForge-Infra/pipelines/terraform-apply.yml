trigger: none  # We dont want every change to be updated


pool:
  vmImage: ubuntu-latest

steps:

  - checkout: self

  - task: TerraformInstaller@1
    displayName: Install Terraform
    inputs:
      terraformVersion: '1.16.2'

  - script: terraform init
    displayName: Terraform Init
    workingDirectory: terraform/environments/dev

  - script: terraform validate
    displayName: Terraform Validate
    workingDirectory: terraform/environments/dev

  - script: terraform apply -auto-approve
    displayName: Terraform Apply
    workingDirectory: terraform/environments/dev
    


# master -> terraform-plan.yml -> Review plan -> Manually run Apply -> terraform-apply.plan -> Azure